name: Playwright Tests
on:
  push:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests --reporter=html
        run: npx playwright test
        env:
          PLATZI_BASE_URL: ${{ secrets.PLATZI_BASE_URL }}
          CONDUIT_BASE_URL: ${{ secrets.CONDUIT_BASE_URL }}
          CONDUIT_EMAIL: ${{ secrets.CONDUIT_EMAIL }}
          CONDUIT_PASSWORD: ${{ secrets.CONDUIT_PASSWORD }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_BASE_URL: ${{ secrets.NEWS_BASE_URL }}
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
